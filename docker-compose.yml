name: shopee-automatic

# Esteira autônoma de ofertas Shopee Afiliados -> Telegram + WhatsApp
# Serviços: n8n (orquestração) | Evolution API v2 (WhatsApp) | PostgreSQL 15 | Redis 7
# O .env guarda apenas segredos de infraestrutura (necessários para os containers
# iniciarem). Credenciais da Shopee, Telegram e WhatsApp são configuradas no painel
# (http://localhost:3100 -> Configurações) e ficam criptografadas no banco.

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - GENERIC_TIMEZONE=${TZ:-America/Sao_Paulo}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_SECURE_COOKIE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # Code Node: libera o módulo nativo crypto (assinatura SHA256 da Shopee)
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      # Permite que o workflow leia DASHBOARD_* via {{ $env.* }}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RUNNERS_ENABLED=true
      # O nó "Config" busca as credenciais no painel a cada execução
      - DASHBOARD_INTERNAL_URL=http://dashboard:3100
      - DASHBOARD_INGEST_TOKEN=${DASHBOARD_INGEST_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - automation
    depends_on:
      - evolution-api
      - dashboard

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "${EVOLUTION_HOST_PORT:-8080}:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - LANGUAGE=pt-BR
      # Autenticação global por apikey (header "apikey")
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DEL_INSTANCE=false
      # Banco de dados
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-evolution}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolution}?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_exchange
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true
      # Cache Redis
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
      # QR Code
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#175197
      # Versão do WhatsApp Web anunciada. Vazio = detectada automaticamente (recomendado).
      # Só defina WA_WEB_VERSION se o QR Code não for gerado ({"count":0}).
      - CONFIG_SESSION_PHONE_CLIENT=Shopee Bot
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - CONFIG_SESSION_PHONE_VERSION=${WA_WEB_VERSION:-}
      - LOG_LEVEL=ERROR,WARN,INFO
      - LOG_COLOR=true
      - LOG_BAILEYS=error
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - automation
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-evolution}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-evolution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - automation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evolution} -d ${POSTGRES_DB:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--port", "6379"]
    volumes:
      - redis_data:/data
    networks:
      - automation
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Painel: observabilidade + configurações (credenciais criptografadas)
  dashboard:
    build: ./dashboard
    image: shopee-automatic/dashboard:latest
    container_name: obs-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_HOST_PORT:-3100}:3100"
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - PORT=3100
      # Token interno n8n <-> painel (ingestão de eventos e leitura da configuração)
      - DASHBOARD_INGEST_TOKEN=${DASHBOARD_INGEST_TOKEN}
      # Chave mestra AES-256 (opcional). Vazia = gerada e guardada no volume dashboard_data
      - CONFIG_MASTER_KEY=${CONFIG_MASTER_KEY:-}
      - DATA_DIR=/data
      # true quando o painel estiver atrás de HTTPS
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Usa o mesmo Postgres; cria o banco "observability" automaticamente
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-evolution}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - OBS_DATABASE=observability
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Verificações de saúde
      - N8N_INTERNAL_URL=http://n8n:5678
      - N8N_API_KEY=${N8N_API_KEY:-}
      - N8N_WORKFLOW_ID=${N8N_WORKFLOW_ID:-}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - SHOPEE_STALE_MINUTES=${SHOPEE_STALE_MINUTES:-90}
      # Legado (opcional): usados só se o campo não tiver sido salvo no painel
      - SHOPEE_APP_ID=${SHOPEE_APP_ID:-}
      - SHOPEE_SECRET=${SHOPEE_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-}
      - WHATSAPP_GROUP_JID=${WHATSAPP_GROUP_JID:-}
    volumes:
      - dashboard_data:/data
    networks:
      - automation
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  automation:
    driver: bridge

volumes:
  n8n_data:
  evolution_instances:
  postgres_data:
  redis_data:
  dashboard_data:
