name: autoachados

# SaaS AutoAchados — site + painel dos clientes + admin (web), worker da esteira,
# PostgreSQL, Redis e Evolution API (WhatsApp, uma instância por cliente).
#
#   cp .env.example .env   (preencha)
#   docker compose up -d --build                 # local: http://localhost:3000
#   docker compose --profile https up -d --build # servidor com domínio: HTTPS automático (Caddy)

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-autoachados}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autoachados}
  APP_MASTER_KEY: ${APP_MASTER_KEY}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  EVOLUTION_API_URL: http://evolution:8080
  EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
  # E-mail (confirmação de cadastro e recuperação de senha)
  APP_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-AutoAchados <nao-responda@seudominio.com.br>}
  TZ: America/Sao_Paulo
  # Vídeos (Shopee Video Studio): armazenamento compatível com S3. Por padrão, o serviço
  # "storage" abaixo; para AWS S3/R2/MinIO próprio, troque S3_ENDPOINT e as credenciais.
  S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-autoachados-videos}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  # Vídeos premium (Gemini da plataforma) — GEMINI DESATIVADO POR ENQUANTO (PREMIUM_ENABLED em
  # src/server/videos/platform.ts). Para reativar, descomente:
  # PLATFORM_GEMINI_API_KEY: ${PLATFORM_GEMINI_API_KEY:-}
  # PLATFORM_GEMINI_MODEL: ${PLATFORM_GEMINI_MODEL:-gemini-omni-1.2-flash}
  # PLATFORM_VIDEO_MAX_DURATION: ${PLATFORM_VIDEO_MAX_DURATION:-10}
  # PLATFORM_VIDEO_MAX_RESOLUTION: ${PLATFORM_VIDEO_MAX_RESOLUTION:-720p}
  # PREMIUM_VIDEOS_TRIAL: ${PREMIUM_VIDEOS_TRIAL:-2}
  VIDEO_DAILY_LIMIT: ${VIDEO_DAILY_LIMIT:-20}
  VIDEO_MAX_ACTIVE: ${VIDEO_MAX_ACTIVE:-5}

x-build: &build
  context: .
  args:
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-5511994554739}
    NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-contato@seudominio.com.br}

services:
  web:
    build: *build
    image: autoachados/platform:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${WEB_HOST_BIND:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    image: autoachados/platform:${IMAGE_TAG:-latest}
    pull_policy: never # mesma imagem do web, construída localmente
    restart: unless-stopped
    command: ["node", "dist/worker.mjs"]
    # WORKER_REPLICAS=0 desliga o worker (ex.: instância de teste com cópia do banco)
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    healthcheck:
      disable: true
    depends_on:
      web: { condition: service_started }
      postgres: { condition: service_healthy }
      evolution: { condition: service_started }

  # Fila de vídeos (gera, baixa, valida e armazena). Separado do worker de ofertas:
  # pode ficar ligado mesmo onde o worker de ofertas está desligado.
  video-worker:
    image: autoachados/platform:${IMAGE_TAG:-latest}
    pull_policy: never
    restart: unless-stopped
    command: ["node", "dist/video-worker.mjs"]
    deploy:
      replicas: ${VIDEO_WORKER_REPLICAS:-1}
    environment:
      <<: *app-env
      VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-3}
    healthcheck:
      disable: true
    depends_on:
      web: { condition: service_started }
      postgres: { condition: service_healthy }
      storage: { condition: service_healthy }

  # Armazenamento de objetos compatível com S3 (SeaweedFS, Apache-2.0). Sem porta no host:
  # os arquivos são privados e entregues pelo site com URL assinada.
  storage:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    # volumeSizeLimitMB: o padrão (30 GB por volume) não cabe em discos de VPS — cada bucket
    # precisa de 7 volumes; com 512 MB, um disco de 10 GB já comporta 19 (testado).
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-ip.bind=0.0.0.0", "-master.volumeSizeLimitMB=512"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DEL_INSTANCE: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-autoachados}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: autoachados
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: 30
      CONFIG_SESSION_PHONE_CLIENT: AutoAchados
      CONFIG_SESSION_PHONE_NAME: Chrome
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoachados}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-autoachados}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/10-evolution.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoachados} -d ${POSTGRES_DB:-autoachados}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Caixa de e-mails de DESENVOLVIMENTO: captura tudo, não envia a ninguém.
  # Ative com COMPOSE_PROFILES=mail-dev no .env e SMTP_HOST=mailpit / SMTP_PORT=1025.
  # Caixa de entrada: http://localhost:8025 (porta: MAILPIT_HOST_PORT)
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail-dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"

  # HTTPS automático — só sobe com: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  caddy_data:
  caddy_config:
  storage_data:
