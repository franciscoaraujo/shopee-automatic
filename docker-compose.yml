name: autoachados

# SaaS AutoAchados — site + painel dos clientes + admin (web), worker da esteira,
# PostgreSQL, Redis e Evolution API (WhatsApp, uma instância por cliente).
#
#   cp .env.example .env   (preencha)
#   docker compose up -d --build                 # local: http://localhost:3000
#   docker compose --profile https up -d --build # servidor com domínio: HTTPS automático (Caddy)

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-autoachados}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autoachados}
  APP_MASTER_KEY: ${APP_MASTER_KEY}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  EVOLUTION_API_URL: http://evolution:8080
  EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
  # E-mail (confirmação de cadastro e recuperação de senha)
  APP_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-AutoAchados <nao-responda@seudominio.com.br>}
  TZ: America/Sao_Paulo

x-build: &build
  context: .
  args:
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-5511994554739}
    NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-contato@seudominio.com.br}

services:
  web:
    build: *build
    image: autoachados/platform:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${WEB_HOST_BIND:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    image: autoachados/platform:${IMAGE_TAG:-latest}
    pull_policy: never # mesma imagem do web, construída localmente
    restart: unless-stopped
    command: ["node", "dist/worker.mjs"]
    # WORKER_REPLICAS=0 desliga o worker (ex.: instância de teste com cópia do banco)
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    healthcheck:
      disable: true
    depends_on:
      web: { condition: service_started }
      postgres: { condition: service_healthy }
      evolution: { condition: service_started }

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DEL_INSTANCE: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-autoachados}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: autoachados
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: 30
      CONFIG_SESSION_PHONE_CLIENT: AutoAchados
      CONFIG_SESSION_PHONE_NAME: Chrome
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoachados}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-autoachados}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/10-evolution.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoachados} -d ${POSTGRES_DB:-autoachados}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Caixa de e-mails de DESENVOLVIMENTO: captura tudo, não envia a ninguém.
  # Ative com COMPOSE_PROFILES=mail-dev no .env e SMTP_HOST=mailpit / SMTP_PORT=1025.
  # Caixa de entrada: http://localhost:8025 (porta: MAILPIT_HOST_PORT)
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail-dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"

  # HTTPS automático — só sobe com: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  caddy_data:
  caddy_config:
